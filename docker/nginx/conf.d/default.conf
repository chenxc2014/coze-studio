# 外层 HTTPS 代理传入的协议和应用前缀，只接受平台支持的固定值。
map $http_x_forwarded_proto $coze_public_scheme {
    default $scheme;
    http http;
    https https;
}
map "$http_x_forwarded_prefix:$request_uri" $coze_public_prefix {
    default "";
    ~^/agent: /agent;
    ~^:/agent(?:/|[?]|$) /agent;
}

server {
    listen 80;
    server_name _;

    # 内网也提供此前缀；重写后重新匹配静态文件和接口 location。
    location = /agent {
        absolute_redirect off;
        return 308 /agent/$is_args$args;
    }
    location ^~ /agent/ {
        rewrite ^/agent(/.*)$ $1 last;
    }

    # Static resources
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        etag on;
        if_modified_since exact;
        add_header Cache-Control "no-cache";
        add_header Cache-Control "public, max-age=3600";
    }

    # API proxy
    location ~ ^/(api|v[1-3]|admin)(/|$) {
        proxy_pass http://coze-server:8888;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coze_public_scheme;
        proxy_set_header X-Forwarded-Prefix $coze_public_prefix;
        proxy_set_header Accept-Encoding "";
        # 修正上游在缺少 Origin 时返回的带端口 Cookie 域，保证会话可被客户端保存。
        proxy_cookie_domain ~^([^:]+):[0-9]+$ $1;
        proxy_cookie_path ~^/(?!agent(?:/|$))(.*)$ $coze_public_prefix/$1;
        proxy_redirect ~^(/(?!agent(?:/|$)).*)$ $coze_public_prefix$1;
        
        # Timeout settings
        proxy_connect_timeout 60s;        # Connection timeout to upstream
        proxy_send_timeout 60s;           # Timeout for sending data to upstream
        proxy_read_timeout 600s;         # Timeout for reading response from upstream (600s for SSE)
        
        
        # SSL/TLS settings
        proxy_ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_verify off;


        sub_filter ':8889' ':8888/local_storage';
        sub_filter 'http://minio:9000' '$coze_public_scheme://$http_host$coze_public_prefix/local_storage';
        sub_filter 'https://minio:9000' '$coze_public_scheme://$http_host$coze_public_prefix/local_storage';
        sub_filter_once off;
        sub_filter_types 'application/json' 'text/event-stream';
    }

    location /local_storage/ {
        if ($args ~* "(^|.*&)x-wf-file_name=[^&]*(&.*|$)") {
            set $args $1$2;
        }
        if ($args ~* "^x-wf-file_name=[^&]*$") {
            set $args "";
        }

        rewrite ^/local_storage/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
    }
}

