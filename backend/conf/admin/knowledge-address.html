<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地址查询 · 药销易-智能体平台</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="knowledge-address.css"><script src="app-base-path.js"></script><script src="knowledge-address.js" defer></script></head>
<body><main><header><div><p class="brand">药销易-智能体平台</p><h1>按地址查询医疗机构</h1><p>按指定地址、街道或区县筛选，查看匹配记录与完整分页。</p></div><a id="back" href="../">返回平台</a></header>
<section class="panel"><form id="search"><label class="wide">知识文档<select id="document" required><option value="">正在读取文档…</option></select></label>
<label>省份<input id="province" placeholder="例如：浙江省" maxlength="150"></label><label>城市<input id="city" placeholder="例如：杭州市" maxlength="150"></label><label>区县<input id="district" placeholder="例如：西湖区" maxlength="150"></label><label>街道、路段或详细地址<input id="address" placeholder="例如：文一路23号" maxlength="150"></label>
<label class="wide">或直接描述地址范围<input id="query" placeholder="例如：查杭州市西湖区有哪些医疗机构" maxlength="300"><small>填写问法时请清空不相关的字段条件；附近、距离和医院等级等条件暂不在此页面查询。</small></label>
<div class="wide controls"><label class="check"><input id="partial" type="checkbox">查看已导入的部分数据</label><label class="size">每页<select id="size"><option>20</option><option>50</option><option>100</option></select>条</label><button id="submit" type="submit">查询</button><button id="reset" class="secondary" type="button">清空条件</button></div></form></section>
<p id="message" role="status" aria-live="polite">请设置至少一个地址条件。</p><section class="panel results" aria-label="查询结果"><div class="result-head"><strong id="summary">尚未查询</strong><span id="applied"></span></div><p id="warning" hidden>文档仍在导入，以下仅是当前已存入的部分记录，总数会随导入变化。</p><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div id="empty" hidden>没有符合这些地址条件的记录。请检查地址或缩小条件；系统不会自动替换为其它地区。</div><nav class="pagination" aria-label="结果翻页"><button id="prev" type="button" disabled>上一页</button><span id="page">第 1 页</span><button id="next" type="button" disabled>下一页</button></nav></section></main></body></html>
